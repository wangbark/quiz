<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuizWeb</title>
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f8fb;color:#18324a;font-family:Sarabun,system-ui,-apple-system,"Segoe UI",sans-serif}
.card{width:min(92vw,460px);background:white;border:1px solid #dbe7ef;border-radius:22px;padding:28px;text-align:center;box-shadow:0 10px 35px rgba(28,62,87,.08)}
h1{font-size:24px;margin:0 0 10px}p{color:#648092;line-height:1.7;margin:0 0 18px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#34a853;animation:p 1s infinite alternate}
a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 18px;border-radius:14px;background:#2078a8;color:white;text-decoration:none;font-weight:700}
@keyframes p{to{opacity:.25}}
</style>
</head>
<body>
<div class="card">
  <h1>กำลังเปิดแบบเรียน <span class="dot"></span></h1>
  <p id="status">กำลังเชื่อมต่อเครื่อง QuizWeb…</p>
  <a id="openBtn" href="#" hidden>เปิดแบบเรียน</a>
</div>
<script>
(async()=>{
  const status=document.getElementById('status');
  const btn=document.getElementById('openBtn');
  try{
    const r=await fetch('https://raw.githubusercontent.com/wangbark/quiz/main/public-url.txt?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('pointer');
    const u=(await r.text()).trim().replace(/\/+$/,'');
    if(!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/i.test(u))throw new Error('url');
    const target=u+location.search+location.hash;
    btn.href=target;
    btn.hidden=false;
    status.textContent='พร้อมแล้ว กำลังเปิด…';
    setTimeout(()=>location.replace(target),150);
  }catch(e){
    status.textContent='ยังเชื่อมต่อไม่ได้ กรุณารอสักครู่แล้วรีเฟรชอีกครั้ง';
  }
})();
</script>
</body>
</html>
