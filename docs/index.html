<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QuizWeb</title>
<meta name="robots" content="noindex">
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f4f8fb}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#loading{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#f4f8fb;font-family:Sarabun,system-ui,-apple-system,"Segoe UI",sans-serif;color:#18324a}
.card{width:min(90vw,420px);padding:26px;text-align:center}
.spinner{width:34px;height:34px;margin:0 auto 16px;border:4px solid #d8e7ef;border-top-color:#2078a8;border-radius:50%;animation:spin .75s linear infinite}
h1{font-size:21px;margin:0 0 8px}
p{font-size:15px;color:#648092;line-height:1.6;margin:0}
button{margin-top:16px;border:0;border-radius:12px;padding:11px 18px;background:#2078a8;color:#fff;font:700 15px inherit;cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loading">
  <div class="card">
    <div class="spinner"></div>
    <h1>กำลังเชื่อมต่อแบบเรียน</h1>
    <p id="status">รอสักครู่…</p>
    <button id="retry" hidden>ลองใหม่</button>
  </div>
</div>

<iframe
  id="app"
  title="QuizWeb"
  allow="autoplay; clipboard-read; clipboard-write"
  referrerpolicy="no-referrer"
></iframe>

<script>
const frame=document.getElementById('app');
const loading=document.getElementById('loading');
const statusEl=document.getElementById('status');
const retry=document.getElementById('retry');

async function loadQuiz(){
  retry.hidden=true;
  loading.style.display='flex';
  statusEl.textContent='รอสักครู่…';

  try{
    const pointer='https://raw.githubusercontent.com/wangbark/quiz/main/public-url.txt?t='+Date.now();
    const r=await fetch(pointer,{cache:'no-store'});
    if(!r.ok) throw new Error('pointer '+r.status);

    const base=(await r.text()).trim().replace(/\/+$/,'');
    if(!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/i.test(base)){
      throw new Error('invalid tunnel');
    }

    const target=base+location.search+location.hash;
    frame.onload=()=>{ loading.style.display='none'; };
    frame.src=target;

    setTimeout(()=>{
      if(loading.style.display!=='none'){
        statusEl.textContent='กำลังโหลดจากเครื่อง QuizWeb…';
      }
    },2500);
  }catch(e){
    statusEl.textContent='ยังเชื่อมต่อเครื่อง QuizWeb ไม่ได้';
    retry.hidden=false;
  }
}

retry.addEventListener('click',loadQuiz);
loadQuiz();
</script>
</body>
</html>
